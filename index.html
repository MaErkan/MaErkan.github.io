<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="أغراض التصغير" />
  <title>أغراض التصغير</title>
  <meta name="description" content="درس تفاعلي في أغراض التصغير للصف العاشر — إعداد المعلم محمد المعصراوي" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root { --m:#7a2436; --p:#f4ecdd; --ink:#1c1915; --muted:#8a8170; --card:#fbf6ec; --ok:#3f5d50; --bd:#e4d8c4; }
    * { box-sizing: border-box; }
    html,body { margin:0; min-height:100dvh; background:var(--p); color:var(--ink); font-family:"Noto Naskh Arabic","Traditional Arabic","Segoe UI",Tahoma,sans-serif; }
    header { position:sticky; top:0; z-index:20; background:#f4ecdd; border-bottom:1px solid var(--bd); }
    .top { max-width:1100px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; padding:8px 16px; }
    #home { background:none; border:0; color:var(--m); font-size:22px; cursor:pointer; font-family:inherit; }
    #phasebar { display:none; }
    @media(min-width:900px){ #phasebar { display:flex; gap:6px; } }
    .ph { font-size:12px; padding:4px 10px; border-radius:999px; color:var(--muted); }
    .ph.on { background:var(--m); color:#fbf6ec; }
    .meta { display:flex; gap:12px; font-size:14px; color:var(--muted); }
    #timer { color:var(--m); }
    .line { height:3px; background:var(--bd); }
    #prog { height:3px; background:var(--m); width:9%; }
    #kicker { max-width:1100px; margin:0 auto; padding:8px 16px 0; color:var(--m); font-size:15px; }
    #intro, #lesson { max-width:1100px; margin:0 auto; padding:8px 16px 48px; }
    .kicker { color:var(--m); font-size:15px; margin:0 0 6px; }
    h1,h2,h3,.h,.t { font-family:Amiri,"Noto Naskh Arabic","Traditional Arabic",serif; }
    h1 { font-size:clamp(28px,5vw,46px); line-height:1.45; margin:0 0 8px; }
    h2 { font-size:clamp(24px,4vw,36px); margin:18px 0 10px; }
    h3 { font-size:22px; }
    .lead,.muted { color:var(--muted); }
    .stage { position:relative; background:#1c1915; border-radius:16px; overflow:hidden; }
    video,img { display:block; width:100%; object-fit:cover; }
    video { aspect-ratio:16/9; background:#1c1915; }
    img { max-height:280px; border-radius:16px; }
    .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(28,25,21,.45); border:0; cursor:pointer; color:#fbf6ec; }
    .play span { background:var(--m); border-radius:12px; padding:14px 28px; font-size:20px; display:flex; flex-direction:column; align-items:center; gap:4px; }
    .play small { font-size:13px; opacity:.85; }
    .b, .next { font-family:inherit; font-size:18px; border:0; border-radius:12px; padding:14px 16px; cursor:pointer; text-align:right; }
    .b { background:var(--card); color:var(--ink); box-shadow:0 0 0 1px rgba(28,25,21,.08); width:100%; margin:4px 0; }
    .b.on { background:var(--m); color:#fbf6ec; }
    .b.ok { background:#3f5d50; color:#f4ecdd; }
    .b.bad { background:var(--m); color:#fbf6ec; }
    .next { background:var(--m); color:#fbf6ec; height:54px; min-width:160px; margin-top:16px; }
    .next:disabled { opacity:.4; cursor:not-allowed; }
    .nav { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
    .nav .next, .nav .back { flex:1; min-width:140px; margin-top:0; }
    .back { background:transparent; color:var(--m); box-shadow:inset 0 0 0 1.5px var(--m); height:54px; font-family:inherit; font-size:18px; border:0; border-radius:12px; cursor:pointer; }
    .backtop { background:transparent; color:var(--m); border:1.5px solid var(--m); border-radius:999px; padding:6px 14px; font-family:inherit; font-size:15px; cursor:pointer; }
    .backtop[hidden] { display:none; }
    .grid2,.grid3,.cols { display:grid; gap:8px; }
    @media(min-width:640px){ .grid2{grid-template-columns:1fr 1fr} .grid3{grid-template-columns:1fr 1fr 1fr} .cols{grid-template-columns:1fr 1fr} }
    .card { background:var(--card); border-radius:14px; padding:14px 16px; margin:10px 0; box-shadow:0 0 0 1px rgba(28,25,21,.06); }
    .c { text-align:center; }
    .quote { background:var(--card); border-radius:14px; padding:18px 20px; font-size:22px; line-height:1.8; }
    mark { background:rgba(122,36,54,.15); color:var(--m); padding:0 4px; border-radius:4px; }
    .fb { border-radius:12px; padding:12px 14px; margin:12px 0; }
    .fb.ok { background:rgba(63,93,80,.12); color:var(--ok); }
    .fb.bad { background:rgba(122,36,54,.1); color:var(--m); }
    .fb .t { font-size:22px; margin:0 0 4px; }
    textarea { width:100%; border:0; border-radius:12px; padding:12px; font:inherit; font-size:18px; background:var(--card); }
    .link { background:none; border:0; color:var(--m); text-decoration:underline; font:inherit; cursor:pointer; }
    .gap { color:var(--m); }
    .credit { color:var(--m); margin-top:24px; }
    footer { border-top:1px solid var(--bd); text-align:center; padding:14px 14px 28px; color:var(--muted); font-size:14px; }
    b { color:var(--m); }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <button type="button" id="home">أغراض التصغير</button>
      <button type="button" id="backbtn" class="backtop" hidden>رجوع</button>
      <div id="phasebar"><span class="ph on">تهيئة</span></div>
      <div class="meta"><span id="timer">02:00</span><span id="score">نقاط الصف 0</span></div>
    </div>
    <div class="line"><div id="prog"></div></div>
    <p id="kicker">تهيئة · الافتتاح</p>
  </header>

  <div id="intro">
    <p class="kicker">اللغة العربية · الصف العاشر</p>
    <h1>أغراض التصغير</h1>
    <p class="lead">درس تفاعلي: نكتشف أغراض التصغير من السياق، لا من الحجم وحده.</p>
    <div class="stage">
      <video id="v" poster="media/open.jpg?v=32" playsinline webkit-playsinline preload="none" controlslist="nodownload">
        <source src="media/tahyia.mp4?v=32" type="video/mp4">
      </video>
      <button class="play" id="playbtn" type="button">
        <span>تشغيل التهيئة بالصوت<small>دقيقة ونصف · أغراض التصغير</small></span>
      </button>
    </div>
    <button class="next" id="gonext" type="button" disabled>إلى الاسترجاع</button>
  </div>

  <div id="lesson" hidden></div>
  <footer>إعداد المعلم محمد المعصراوي</footer>

  <script>
    (function () {
      var v = document.getElementById("v");
      var play = document.getElementById("playbtn");
      var next = document.getElementById("gonext");
      function startVideo() {
        if (play) play.style.display = "none";
        if (next) next.disabled = false;
        v.removeAttribute("poster");
        v.setAttribute("controls", "controls");
        v.setAttribute("playsinline", "");
        v.setAttribute("webkit-playsinline", "true");
        v.playsInline = true;
        v.muted = false;
        v.defaultMuted = false;
        v.volume = 1;
        try { v.currentTime = 0; } catch (e) {}
        var run = v.play();
        if (run && run.then) {
          run.then(function () { window.__started = true; }).catch(function () {
            v.muted = true;
            v.play().then(function () {
              v.muted = false;
              window.__started = true;
            }).catch(function () {
              window.__started = true;
            });
          });
        } else {
          window.__started = true;
        }
      }
      if (play) play.addEventListener("click", startVideo);
      if (next) next.addEventListener("click", function () {
        if (window.goScreen) window.goScreen("recall");
        else {
          var n = 0;
          var t = setInterval(function () {
            n++;
            if (window.goScreen) { clearInterval(t); window.goScreen("recall"); }
            if (n > 80) clearInterval(t);
          }, 50);
        }
      });
    })();
  </script>
  <script src="app.js?v=10" defer></script>
</body>
</html>
